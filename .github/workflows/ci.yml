name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 检查 Go 格式
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: 安装与当前 Go 工具链匹配的 golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: golangci-lint
        run: golangci-lint run ./...
      - name: 检查脚本语法
        # V5-5：自动发现 scripts/**/*.sh，按 shebang 分派解释器。
        # 不能统一用 bash -n：build-release.sh 是 #!/usr/bin/env sh，CI 里也是
        # 按 sh 真跑的（ubuntu 的 /bin/sh 是 dash），bash -n 会放行 bashism。
        # 也不能用 `find ... -exec bash -n {} +`：已实测它在子脚本语法错误时
        # 仍返回 0。未知/缺失 shell shebang 一律 fail-closed，逼新增脚本显式
        # 声明由哪个 shell 解释。
        run: |
          set -u
          tmp_list="$(mktemp)"
          trap 'rm -f "$tmp_list"' EXIT
          find scripts -type f -name '*.sh' -print0 >"$tmp_list" || exit 1
          n=0
          while IFS= read -r -d '' f; do
            shebang="$(head -n 1 "$f")" || exit 1
            case "$shebang" in
              *"env sh"|*"/bin/sh")
                sh -n "$f" || exit 1
                ;;
              *"env bash"|*"/bin/bash")
                bash -n "$f" || exit 1
                ;;
              *)
                echo "unsupported or missing shell shebang: $f: $shebang" >&2
                exit 1
                ;;
            esac
            n=$((n + 1))
          done <"$tmp_list"
          echo "shell syntax OK: $n 个脚本"
      - name: bench gate fixture 测试
        # V5-5：固定 fixture 钉住 bench_gate.sh 的完整性判据（只有 ns/op 时
        # 必须失败），不依赖真实 benchmark 的抖动。
        run: ./scripts/bench_gate_test.sh

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 检查依赖清单和校验和
        run: |
          go mod tidy -diff
          go mod verify
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

  benchmark:
    name: Benchmark (ubuntu-latest)
    # C-BENCH-CI：性能回归。独立于 lint/test。同一 runner 采集 base→head，
    # benchstat 对比写进 Run Summary；硬门禁只看 allocs/op 与 B/op 的相对退化
    # （由代码路径唯一决定，跨 runner 稳定），sec/op 绝对时间抖动大，仅告警
    # 不拦截（建议 3/4 的分工，见 scripts/bench_gate.sh 头注释）。
    # 观察模式逃生口：仓库变量 BENCH_GATE=off；阈值经 BENCH_GATE_THRESHOLD
    # 调整（默认 10%）。
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      BENCH_GATE: ${{ vars.BENCH_GATE || 'on' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 解析 base 提交
        id: base
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base "origin/${GITHUB_BASE_REF:-main}" HEAD)"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          echo "base=${base:-none}" >> "$GITHUB_OUTPUT"
      - name: 安装 benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: 采集 base 基准
        if: steps.base.outputs.base != 'none'
        run: |
          git checkout "$BASE"
          go test -run=xxx -bench=. -benchmem -count=6 ./internal/tui/... | tee "$RUNNER_TEMP/bench-base.txt"
        env:
          BASE: ${{ steps.base.outputs.base }}
      - name: 采集 head 基准
        run: |
          git checkout "$GITHUB_SHA"
          go test -run=xxx -bench=. -benchmem -count=6 ./internal/tui/... | tee "$RUNNER_TEMP/bench-head.txt"
      - name: benchstat 对比（写入 Run Summary）
        run: |
          {
            echo "## Benchmark 对比（base → head，同一 runner）"
            echo
            if [ "${BASE_NONE:-0}" = "1" ]; then
              echo "（无 base 提交，仅记录 head 数据）"
              echo
            fi
            echo '```'
            benchstat "$RUNNER_TEMP/bench-base.txt" "$RUNNER_TEMP/bench-head.txt" 2>/dev/null \
              || benchstat "$RUNNER_TEMP/bench-head.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          benchstat "$RUNNER_TEMP/bench-base.txt" "$RUNNER_TEMP/bench-head.txt" 2>/dev/null \
            || benchstat "$RUNNER_TEMP/bench-head.txt"
        env:
          BASE_NONE: ${{ steps.base.outputs.base == 'none' && '1' || '0' }}
      - name: 门禁：allocs/op 与 B/op 相对退化（建议 4）
        if: steps.base.outputs.base != 'none'
        run: |
          set -o pipefail
          scripts/bench_gate.sh "$RUNNER_TEMP/bench-base.txt" "$RUNNER_TEMP/bench-head.txt" \
            > "$RUNNER_TEMP/bench-gate.txt" || gate_rc=$?
          {
            echo "## Bench gate（allocs/op 与 B/op 相对退化，建议 4）"
            echo
            echo '```'
            cat "$RUNNER_TEMP/bench-gate.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/bench-gate.txt"
          exit "${gate_rc:-0}"

  build:
    name: Build (Linux/macOS)
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 构建发布包
        run: ./scripts/build-release.sh "$BUILD_VERSION"
      - name: 验证发布包内核释放、配置校验与真实内核启停
        run: |
          mkdir -p "$RUNNER_TEMP/karing-release"
          tar -xzf "dist/karing-tui-$BUILD_VERSION/karing-tui-$BUILD_VERSION-linux-amd64.tar.gz" -C "$RUNNER_TEMP/karing-release"
          export KARING_HOME="$RUNNER_TEMP/karing-release-home"
          "$RUNNER_TEMP/karing-release/karing" version
          # C13 起只读命令不再隐式创建/迁移数据库（见 storage.OpenQueryOnly），
          # 因此先用一次可写路径完成数据目录初始化，再验证只读输出。
          # 用 backup export 而不是 config check：它不依赖 sing-box 内核，
          # 从而让下面那条 test -x 仍然真实覆盖「只读命令释放内核」这条路径。
          "$RUNNER_TEMP/karing-release/karing" backup export "$RUNNER_TEMP/karing-init-backup"
          "$RUNNER_TEMP/karing-release/karing" status --json
          test -x "$KARING_HOME/runtime/bin/sing-box"
          # C15：还没有任何节点时必须失败（不得静默生成一份全部直连的配置）
          if "$RUNNER_TEMP/karing-release/karing" config check; then
            echo "C15：无可用节点时 config check 不应成功" >&2
            exit 1
          fi
          # C15 起「全局没有任何可用节点」会 fail-closed（不再生成一份全部直连的配置），
          # 所以先补一个最小 Clash 配置建出节点，再验证真实的「生成 + 内核校验」路径。
          printf 'proxies:\n  - name: ci-node\n    type: trojan\n    server: 127.0.0.1\n    port: 443\n    password: ci-password\n' > "$RUNNER_TEMP/karing-ci-node.yaml"
          "$RUNNER_TEMP/karing-release/karing" import clash "$RUNNER_TEMP/karing-ci-node.yaml"
          "$RUNNER_TEMP/karing-release/karing" config check
          # V9-5/V9-6：bootstrap 安全门禁。三组「合法形态」真启动、真解析、真拨号；
          # 缺陷形态（经代理组的 DNS + 域名型节点）必须在**生成阶段** fail-closed，
          # 不再交给内核静默卡死（实测内核只会反复重试、不报错）。
          # 加新真机用例时记得同步这里的 -run 正则，否则它只在本地跑。
          SINGBOX_BIN="$KARING_HOME/runtime/bin/sing-box" go test -count=1 ./internal/core \
            -run 'TestIntegrationRealSingBox|TestRealSingBoxDNSResolverCycle|TestRealSingBoxDNSBootstrapSafety' -v
          # 独立节点测速的临时配置只有**真启动**才能验证合法：实测 sing-box check 对
          # detour=direct（detour to an empty direct outbound）、悬空 domain_resolver
          # （dependency not found）、悬空 detour（outbound detour not found）一律返回 0，
          # 这些错误只在 run 阶段暴露。这一步跑的用例同时覆盖「域名型节点能否解析」。
          SINGBOX_BIN="$KARING_HOME/runtime/bin/sing-box" go test -count=1 ./internal/proxy -run TestLatencyProbe -v
      - name: 只读命令在未初始化数据目录上必须失败且不留数据库
        run: |
          export KARING_HOME="$RUNNER_TEMP/karing-fresh"
          if "$RUNNER_TEMP/karing-release/karing" status --json; then
            echo "未初始化时 status 不应成功（C13：只读命令不得隐式建库）" >&2
            exit 1
          fi
          # 关键：失败路径上不得留下 0 字节 karing.db，否则会掩盖 KARING_HOME 指错路径。
          test ! -e "$KARING_HOME/karing.db"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/*.tar.gz
            dist/*/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
