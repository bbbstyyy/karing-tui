name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 检查 Go 格式
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: 安装与当前 Go 工具链匹配的 golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: golangci-lint
        run: golangci-lint run ./...
      - name: 检查脚本语法
        run: |
          sh -n scripts/build-release.sh
          bash -n scripts/gen-catalog.sh
          bash -n scripts/sync-builtin-rulesets.sh

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 检查依赖清单和校验和
        run: |
          go mod tidy -diff
          go mod verify
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

  build:
    name: Build (Linux/macOS)
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 构建发布包
        run: ./scripts/build-release.sh "$BUILD_VERSION"
      - name: 验证发布包内核释放、配置校验与真实内核启停
        run: |
          mkdir -p "$RUNNER_TEMP/karing-release"
          tar -xzf "dist/karing-tui-$BUILD_VERSION/karing-tui-$BUILD_VERSION-linux-amd64.tar.gz" -C "$RUNNER_TEMP/karing-release"
          export KARING_HOME="$RUNNER_TEMP/karing-release-home"
          "$RUNNER_TEMP/karing-release/karing" version
          # C13 起只读命令不再隐式创建/迁移数据库（见 storage.OpenQueryOnly），
          # 因此先用一次可写路径完成数据目录初始化，再验证只读输出。
          # 用 backup export 而不是 config check：它不依赖 sing-box 内核，
          # 从而让下面那条 test -x 仍然真实覆盖「只读命令释放内核」这条路径。
          "$RUNNER_TEMP/karing-release/karing" backup export "$RUNNER_TEMP/karing-init-backup"
          "$RUNNER_TEMP/karing-release/karing" status --json
          test -x "$KARING_HOME/runtime/bin/sing-box"
          # C15：还没有任何节点时必须失败（不得静默生成一份全部直连的配置）
          if "$RUNNER_TEMP/karing-release/karing" config check; then
            echo "C15：无可用节点时 config check 不应成功" >&2
            exit 1
          fi
          # C15 起「全局没有任何可用节点」会 fail-closed（不再生成一份全部直连的配置），
          # 所以先补一个最小 Clash 配置建出节点，再验证真实的「生成 + 内核校验」路径。
          printf 'proxies:\n  - name: ci-node\n    type: trojan\n    server: 127.0.0.1\n    port: 443\n    password: ci-password\n' > "$RUNNER_TEMP/karing-ci-node.yaml"
          "$RUNNER_TEMP/karing-release/karing" import clash "$RUNNER_TEMP/karing-ci-node.yaml"
          "$RUNNER_TEMP/karing-release/karing" config check
          SINGBOX_BIN="$KARING_HOME/runtime/bin/sing-box" go test -count=1 ./internal/core -run TestIntegrationRealSingBox -v
      - name: 只读命令在未初始化数据目录上必须失败且不留数据库
        run: |
          export KARING_HOME="$RUNNER_TEMP/karing-fresh"
          if "$RUNNER_TEMP/karing-release/karing" status --json; then
            echo "未初始化时 status 不应成功（C13：只读命令不得隐式建库）" >&2
            exit 1
          fi
          # 关键：失败路径上不得留下 0 字节 karing.db，否则会掩盖 KARING_HOME 指错路径。
          test ! -e "$KARING_HOME/karing.db"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/*.tar.gz
            dist/*/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
